<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchaeferAnjon 的软件</title>
<meta name="description" content="SchaeferAnjon 一个人做的几个小软件：MeetCaption、Ask Free、GetNewWord。">
<link rel="icon" href="meetcaption.png">
<style>
:root {
  color-scheme: light;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --bg: #fbfbfc; --surface: #ffffff; --surface-2: #f3f3f5; --surface-3: #e9e9ec;
  --text: #111113; --text-2: #6e6e73; --text-3: #a1a1a6;
  --line: rgba(17,17,19,.08); --line-2: rgba(17,17,19,.14);
  --btn: #111113; --btn-text: #ffffff;
  --shadow: 0 1px 2px rgba(17,17,19,.04), 0 8px 24px rgba(17,17,19,.06);
  --pop-shadow: 0 2px 6px rgba(17,17,19,.08), 0 18px 40px rgba(17,17,19,.14);
  /* 三个软件各自的主色，取自各自的应用 */
  --mc: #5a5ff0; --af: #2f6feb; --gnw: #5e6ad2; --mark: #e5484d; --ok: #1d9a54;
  /* Ask Free 演示里的桌面、GetNewWord 演示里的网页 */
  --desk: linear-gradient(135deg, #e7ecf6 0%, #eef0f5 45%, #f3ece9 100%);
  --page: #ffffff; --page-line: #ececef;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f0f11; --surface: #161618; --surface-2: #1d1d20; --surface-3: #26262a;
    --text: #f2f2f4; --text-2: #9a9aa0; --text-3: #6a6a70;
    --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
    --btn: #f2f2f4; --btn-text: #111113;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --pop-shadow: 0 2px 6px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.45);
    --mc: #7176ff; --af: #6c9dff; --gnw: #7c86e6; --mark: #ff6369; --ok: #3fcf7f;
    --desk: linear-gradient(135deg, #1d2230 0%, #1b1c22 50%, #241e1f 100%);
    --page: #1b1b1e; --page-line: #2a2a2e;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; text-autospace: normal; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
img { display: block; }
.wrap { width: min(1160px, calc(100% - 80px)); margin: 0 auto; }
.ico { width: 14px; height: 14px; flex: none; fill: currentColor; }
.ico.s { stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* 顶栏：品牌名小小地在左上角 */
.nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(16px); }
.nav .in { height: 60px; display: flex; align-items: center; gap: 26px; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: 0; }
.brand .minis { display: flex; gap: 3px; margin-right: 2px; }
.brand .minis img { width: 17px; height: 17px; border-radius: 4px; box-shadow: 0 0 0 1px var(--line-2); }
.nav .links { display: flex; gap: 22px; font-size: 14px; color: var(--text-2); }
.nav .links a:hover { color: var(--text); }
.nav .sp { flex: 1; }
.nav .gh { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-2); }
.nav .gh:hover { color: var(--text); }
.seg { display: flex; padding: 2px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); }
.seg button { border: 0; background: none; padding: 3px 11px; border-radius: 999px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.seg button.on { background: var(--btn); color: var(--btn-text); }

/* 开头一句 */
.intro { padding: 34px 0 30px; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
.kicker { font-size: 13px; color: var(--text-2); letter-spacing: .02em; }
.intro h1 { margin: 8px 0 0; font-family: var(--serif); font-weight: 700; font-size: 44px; line-height: 1.22; letter-spacing: 0; }
.intro p { margin: 0; max-width: 24em; text-wrap: balance; font-size: 15px; color: var(--text-2); text-align: right; }
.intro p b { color: var(--text); font-weight: 500; }

/* 一排软件 */
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 20px; }
.app { position: relative; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); padding: 8px; }
.stage { position: relative; height: 224px; border-radius: 11px; overflow: hidden; isolation: isolate; }
.app-body { padding: 16px 12px 12px; display: flex; flex-direction: column; flex: 1; }
.app-head { display: flex; align-items: center; gap: 12px; }
.app-ic { width: 40px; height: 40px; border-radius: 9px; box-shadow: 0 0 0 1px var(--line); }
.app-head h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.25; }
.app-head .alt { font-size: 12.5px; color: var(--text-3); }
.app-line { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: var(--text-2); min-height: 3.2em; text-wrap: pretty; }
.foot-g { margin-top: auto; padding-top: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tags li { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 6px; background: var(--surface-2); font-size: 12.5px; color: var(--text-2); }
.tags li .ico { width: 12px; height: 12px; }
.cta { display: flex; align-items: center; gap: 8px; padding-top: 14px; position: relative; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 15px; border-radius: 999px; font-size: 13.5px; font-weight: 500; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); white-space: nowrap; }
.pill:hover { background: var(--surface-2); }
.pill.dark { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
.pill.dark:hover { opacity: .88; }
.pill .plats { display: flex; gap: 4px; opacity: .8; }
.pill .plats .ico { width: 12px; height: 12px; }
.cta .soon { display: inline-flex; align-items: center; height: 34px; padding: 0 15px; border-radius: 999px; border: 1px dashed var(--line-2); font-size: 13.5px; color: var(--text-3); }
.cta .note { margin-left: auto; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.dlpop { position: absolute; left: 0; bottom: 44px; z-index: 5; display: none; width: 330px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--pop-shadow); }
.dlpop.on { display: block; }
.dlpop .t { font-size: 12.5px; color: var(--text-2); margin: 0 2px 8px; }
.dlpop .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dlpop .row a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border-radius: 10px; background: var(--surface-2); font-size: 13px; font-weight: 500; }
.dlpop .row a:hover { background: var(--surface-3); }
.dlpop .row a .ico { width: 18px; height: 18px; }
.dlpop .row small { font-size: 11px; font-weight: 400; color: var(--text-3); }

/* 三件不变的事 */
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 22px 0 0; padding: 20px 0 0; border-top: 1px solid var(--line); }
.facts div { font-size: 13.5px; color: var(--text-2); }
.facts b { display: block; font-size: 14px; color: var(--text); font-weight: 600; margin-bottom: 2px; }

/* 关于 */
.about { margin-top: 64px; padding: 56px 0 64px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1.15fr 1fr; gap: 72px; }
.about h2 { margin: 6px 0 18px; font-family: var(--serif); font-weight: 700; font-size: 36px; line-height: 1.25; }
.about p { margin: 0 0 14px; font-size: 15.5px; line-height: 1.8; color: var(--text-2); max-width: 34em; }
.about p b { color: var(--text); font-weight: 500; }
.ways { margin: 0; padding: 0; list-style: none; }
.ways li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.ways li:first-child { border-top: 1px solid var(--line); }
.ways .n { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--text-3); line-height: 1.4; }
.ways span { color: var(--text-2); }
.ways span b { color: var(--text); font-weight: 500; }
.contact { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* 页尾（总站自己的） */
.sitefoot { border-top: 1px solid var(--line); padding: 22px 0 34px; }
.sitefoot .row { display: flex; justify-content: space-between; align-items: center; gap: 20px; font-size: 12.5px; color: var(--text-3); }

/* 出品小条：放进每个软件官网页尾，颜色跟着所在网站的文字色走 */
.xstrip { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 16px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
.xstrip .by b { font-weight: 600; color: var(--text); }
.xstrip .by u { text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.xstrip .by:hover u { text-decoration-color: currentColor; color: var(--text); }
.xstrip .icons { display: flex; gap: 8px; }
.xstrip .icons a { position: relative; display: block; width: 22px; height: 22px; }
.xstrip .icons img { width: 22px; height: 22px; border-radius: 5px; box-shadow: 0 0 0 1px var(--line); transition: transform .15s; }
.xstrip .icons a:hover img { transform: translateY(-1px); }
.xstrip .icons a.cur::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--text-3); }
.xstrip .icons a .tip { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); padding: 3px 8px; border-radius: 6px; background: var(--btn); color: var(--btn-text); font-size: 11.5px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; }
.xstrip .icons a:hover .tip { opacity: 1; }
.xstrip .sep { color: var(--text-3); }

/* ===== 演示：MeetCaption 逐词出字幕 ===== */
.mc-stage { background: #15161a; }
.mc-call { position: absolute; inset: 10px 10px 10px 10px; display: grid; grid-template-columns: 1fr 92px; gap: 8px; }
.mc-call .tile { position: relative; border-radius: 8px; background: linear-gradient(160deg, #2b2e38, #22242c); display: grid; place-items: center; }
.mc-call .tile.big { border: 2px solid rgba(63,207,127,.75); }
.mc-call .tile.small { align-self: start; height: 70px; }
.mc-call .av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(140deg, #8fb79a, #5f8f72); color: #fff; font-weight: 600; font-size: 18px; margin-top: -36px; }
.mc-call .tile.small .av { width: 30px; height: 30px; font-size: 12px; margin: 0; background: linear-gradient(140deg, #8a93c9, #5e66a8); }
.mc-call .nm { position: absolute; right: 8px; top: 6px; font-size: 10.5px; color: rgba(255,255,255,.7); }
.mc-cap { position: absolute; left: 18px; right: 18px; bottom: 16px; padding: 9px 12px 10px; border-radius: 10px; background: rgba(12,12,16,.78); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.08); min-height: 72px; }
.mc-cap .lp { position: absolute; right: 10px; top: -10px; height: 20px; padding: 0 8px; border-radius: 6px; background: #2a2b33; color: rgba(255,255,255,.75); font-size: 10.5px; line-height: 20px; }
.mc-cap .src { font-size: 15px; line-height: 1.4; color: #f2f2f4; min-height: 21px; font-weight: 500; }
.mc-cap .tr { margin-top: 3px; font-size: 13px; line-height: 1.4; min-height: 18px; }
.mc-cap .w { display: inline; opacity: 0; transition: opacity .18s; }
.mc-cap .w.on { opacity: 1; }
.k1 { color: #7cbcff; } .k2 { color: #f5c46b; } .k3 { color: #7ad69a; } .k4 { color: #f59ac5; }
.mc-cap .src .k1, .mc-cap .src .k2, .mc-cap .src .k3, .mc-cap .src .k4 { color: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.mc-cap .src .k1 { text-decoration-color: #7cbcff; } .mc-cap .src .k2 { text-decoration-color: #f5c46b; } .mc-cap .src .k3 { text-decoration-color: #7ad69a; } .mc-cap .src .k4 { text-decoration-color: #f59ac5; }
.mc-live { position: absolute; left: 20px; top: 18px; display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: rgba(255,255,255,.72); }
.mc-live i { width: 6px; height: 6px; border-radius: 50%; background: #3fcf7f; box-shadow: 0 0 0 3px rgba(63,207,127,.2); }

/* ===== 演示：Ask Free 问一句就答 ===== */
.af-stage { background: var(--desk); }
.af-menubar { position: absolute; left: 0; right: 0; top: 0; height: 18px; background: color-mix(in srgb, var(--surface) 70%, transparent); display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 9px; font-size: 9.5px; color: var(--text-2); }
.af-menubar img { width: 11px; height: 11px; border-radius: 2px; }
.af-win { position: absolute; left: 12px; top: 96px; width: 232px; height: 114px; border-radius: 8px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.22); transition: opacity .3s; }
.af-win .bar { height: 18px; display: flex; align-items: center; gap: 4px; padding: 0 7px; font-size: 9px; }
.af-win .bar i { width: 6px; height: 6px; border-radius: 50%; background: #ff5f57; } .af-win .bar i + i { background: #febc2e; } .af-win .bar i + i + i { background: #28c840; }
.af-win .bar span { margin-left: 6px; }
.af-term { background: #1e1f24; color: #c9c9cd; }
.af-term .bar { background: #2a2b31; color: #9a9aa0; }
.af-term .body { padding: 8px 10px; font: 10px/1.65 var(--mono); }
.af-term .err { color: #ff8a8f; display: inline-block; }
.af-term .dim { color: #6a6a70; }
.af-sheet { background: var(--page); color: var(--text); }
.af-sheet .bar { background: var(--surface-2); color: var(--text-2); }
.af-sheet table { border-collapse: collapse; width: 100%; font-size: 9.5px; }
.af-sheet td { border: 1px solid var(--page-line); padding: 2px 6px; height: 17px; }
.af-sheet td:first-child { color: var(--text-3); width: 18px; text-align: center; background: var(--surface-2); }
.af-sheet td.num { text-align: right; font-variant-numeric: tabular-nums; }
.af-sheet tr.hd td { background: var(--surface-2); color: var(--text-2); font-weight: 500; }
.af-col { display: inline-block; }
.af-mark { position: absolute; border: 1.5px solid var(--mark); border-radius: 3px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.af-mark.on { opacity: 1; }
.af-ptr { position: absolute; left: 0; top: 0; width: 15px; height: 21px; transition: transform .8s cubic-bezier(.3,.7,.2,1); z-index: 4; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.af-cap { position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 10px); height: 30px; padding: 0 12px; border-radius: 999px; background: #1c1c20; display: flex; align-items: center; gap: 8px; color: #e6e6ea; font-size: 11px; opacity: 0; transition: opacity .2s, transform .25s; z-index: 3; box-shadow: 0 0 0 3px color-mix(in srgb, var(--af) 45%, transparent), 0 6px 18px rgba(0,0,0,.3); }
.af-cap.on { opacity: 1; transform: translate(-50%, 0); }
.af-cap .wave { display: flex; align-items: center; gap: 2px; height: 16px; }
.af-cap .wave i { width: 3px; height: 4px; border-radius: 2px; background: linear-gradient(#f59ac5, #a78bfa, #6c9dff); }
.af-cap.talk .wave i { animation: wv .5s ease-in-out infinite alternate; }
.af-cap .wave i:nth-child(2) { animation-delay: -.1s; } .af-cap .wave i:nth-child(3) { animation-delay: -.3s; } .af-cap .wave i:nth-child(4) { animation-delay: -.15s; } .af-cap .wave i:nth-child(5) { animation-delay: -.4s; } .af-cap .wave i:nth-child(6) { animation-delay: -.22s; }
@keyframes wv { from { height: 3px; } to { height: 15px; } }
.af-key { position: absolute; right: 12px; bottom: 14px; height: 24px; padding: 0 8px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 2px 0 var(--line-2); font-size: 10.5px; color: var(--text-2); line-height: 22px; transition: transform .1s, box-shadow .1s; z-index: 3; }
.af-key.down { transform: translateY(2px); box-shadow: 0 0 0 var(--line-2); color: var(--af); border-color: var(--af); }
.af-ans { position: absolute; right: 10px; top: 26px; width: 196px; padding: 9px 11px 10px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--pop-shadow); border: 1px solid var(--line); opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .3s; z-index: 3; }
.af-ans.on { opacity: 1; transform: none; }
.af-ans::before { content: ""; position: absolute; left: 6px; top: 12px; bottom: 12px; width: 2.5px; border-radius: 2px; background: var(--af); }
.af-ans .h { font-size: 10px; font-weight: 600; color: var(--af); letter-spacing: .02em; }
.af-ans .q { font-size: 12.5px; font-weight: 600; margin-top: 1px; line-height: 1.35; }
.af-ans .a { margin-top: 5px; font-size: 11.5px; line-height: 1.55; color: var(--text-2); min-height: 36px; }
.af-ans .a code { font: 10.5px/1.5 var(--mono); background: var(--surface-2); color: var(--text); padding: 1px 5px; border-radius: 4px; }

/* ===== 演示：GetNewWord 框词出释义 ===== */
.gnw-stage { background: var(--surface-2); }
.gnw-page { position: absolute; left: 14px; right: 14px; top: 14px; bottom: -10px; border-radius: 8px; background: var(--page); box-shadow: 0 1px 2px rgba(0,0,0,.06); padding: 16px 18px; }
.gnw-page .ln { height: 7px; border-radius: 3px; background: var(--page-line); margin: 0 0 9px; }
.gnw-page .ln.h { width: 46%; height: 10px; background: var(--surface-3); margin-bottom: 14px; }
.gnw-page .ln.s { width: 72%; }
.gnw-page .sent { margin: 2px 0 12px; font-size: 15.5px; line-height: 1.5; color: var(--text); font-family: Georgia, "Times New Roman", var(--serif); }
.gnw-page .sent .tw { transition: color .3s; }
.gnw-page .sent .tw.hit { color: var(--gnw); }
.vf { position: absolute; left: 0; top: 0; width: 10px; height: 10px; opacity: 0; transition: left .5s cubic-bezier(.3,.7,.2,1), top .5s cubic-bezier(.3,.7,.2,1), width .5s cubic-bezier(.3,.7,.2,1), height .5s cubic-bezier(.3,.7,.2,1), opacity .2s; pointer-events: none; z-index: 2; }
.vf.on { opacity: 1; }
.vf i { position: absolute; width: 9px; height: 9px; border: 2px solid var(--gnw); }
.vf .a { left: -2px; top: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 3px; }
.vf .b { right: -2px; top: -2px; border-left: 0; border-bottom: 0; border-top-right-radius: 3px; }
.vf .c { left: -2px; bottom: -2px; border-right: 0; border-top: 0; border-bottom-left-radius: 3px; }
.vf .d { right: -2px; bottom: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 3px; }
.gnw-pop { position: absolute; left: 0; top: 0; width: 200px; padding: 10px 12px 11px; border-radius: 12px; background: #1c1d22; color: #ececf0; box-shadow: 0 10px 30px rgba(0,0,0,.28); opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .3s; z-index: 3; }
.gnw-pop.on { opacity: 1; transform: none; }
.gnw-pop.fly { transition: transform .6s cubic-bezier(.5,0,.6,1), opacity .6s; opacity: 0; }
.gnw-pop .w { font-size: 13.5px; font-weight: 600; }
.gnw-pop .w small { font-weight: 400; font-size: 10.5px; color: #9a9aa6; margin-left: 6px; }
.gnw-pop .m { font-size: 13px; color: #a9b0ff; margin-top: 2px; font-weight: 500; }
.gnw-pop .ctx { font-size: 11px; line-height: 1.5; color: #a3a3ad; margin-top: 4px; }
.gnw-anki { position: absolute; right: 22px; top: 22px; z-index: 4; height: 24px; padding: 0 9px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-2); }
.gnw-anki b { color: var(--text); font-weight: 600; display: inline-block; min-width: 16px; transition: transform .2s; }
.gnw-anki b.bump { transform: scale(1.35); color: var(--gnw); }
.gnw-anki .sq { width: 10px; height: 8px; border: 1.5px solid var(--gnw); border-radius: 2px; }

/* ===== 窄屏 ===== */
@media (max-width: 1080px) {
  .nav .links { display: none; }
}
@media (max-width: 720px) {

/* ===== 演示动画 ===== */
let GEN = 0;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function mkRunner(stage, gen) {
  let paused = false;
  stage.onmouseenter = () => { paused = true; }; stage.onmouseleave = () => { paused = false; };
  return async (ms) => {
    let left = ms;
    while (left > 0) { await sleep(Math.min(left, 100)); if (gen !== GEN) throw 0; if (!paused) left -= 100; }
  };
}

function splitWords(s) { return /[぀-ヿ一-鿿]/.test(s) ? s.match(/.{1,2}/gu) : s.split(/(?<= )/); }
async function demoMC(gen) {
  const st = document.getElementById("st-mc"); if (!st) return;
  st.innerHTML = `<div class="mc-call"><div class="tile big"><span class="av">L</span><span class="nm">Lena</span></div><div class="tile small"><span class="av">${tr("mc.me")}</span></div></div>
    <span class="mc-live"><i></i>${tr("mc.live")}</span>
    <div class="mc-cap"><span class="lp"></span><div class="src"></div><div class="tr"></div></div>`;
  const W = mkRunner(st, gen), lp = st.querySelector(".lp"), src = st.querySelector(".src"), trn = st.querySelector(".tr");
  const build = (el, chunks) => { el.innerHTML = chunks.map(([t, k], i) => `<span class="k${k}">${splitWords(t).map(w => `<span class="w">${w}</span>`).join("")}</span>${i < chunks.length - 1 && !/[぀-ヿ一-鿿]$/.test(t) ? " " : ""}`).join(""); return [...el.querySelectorAll(".w")]; };
  const lines = MC_LINES[LANG];
  if (REDUCED) { const L = lines[0]; lp.textContent = L.lp; build(src, L.src).forEach(w => w.classList.add("on")); build(trn, L.tr).forEach(w => w.classList.add("on")); return; }
  for (let i = 0; ; i = (i + 1) % lines.length) {
    const L = lines[i]; lp.textContent = L.lp;
    const sw = build(src, L.src), tw = build(trn, L.tr);
    for (const w of sw) { w.classList.add("on"); await W(150); }
    await W(250);
    for (const sp of trn.children) { sp.querySelectorAll(".w").forEach(w => w.classList.add("on")); await W(230); }
    await W(3000);
    sw.concat(tw).forEach(w => w.classList.remove("on"));
    await W(450);
  }
}
